
services:
###> doctrine/doctrine-bundle ###
  database:
    image: mariadb:11.8.3
    environment:
      MYSQL_DATABASE: bookforeveryone
      MYSQL_USER: bookforeveryone
      MYSQL_PASSWORD: bookforeveryone
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - ./docker/db/data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

# Note: Docker non installato. MariaDB è in esecuzione localmente come servizio Windows.
