
services:
###> doctrine/doctrine-bundle ###
  database:
    image: mariadb:11.8.3
    environment:
      MYSQL_DATABASE: bookforeveryone
      MYSQL_USER: bookforeveryone
      MYSQL_PASSWORD: bookforeveryone
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - ./docker/db/data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

###> symfony/mercure-bundle ###
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':3000'
      MERCURE_PUBLISHER_JWT_KEY: 'BookForEveryoneMercureSecret2026!'
      MERCURE_SUBSCRIBER_JWT_KEY: 'BookForEveryoneMercureSecret2026!'
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8000 http://127.0.0.1:8000
        anonymous
    ports:
      - "3000:3000"
###< symfony/mercure-bundle ###

# Note: Docker non installato. MariaDB è in esecuzione localmente come servizio Windows.
